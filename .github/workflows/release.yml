name: Release

# Builds the Thunderstore package on every pull request and master push
# (uploading it as a build artifact), and publishes a GitHub release when a
# version tag is pushed or the workflow is dispatched manually. On dispatch
# the tag is derived from the manifest version and created at the exact
# commit that was built. When the THUNDERSTORE_API_KEY secret is configured,
# the released zip is then published to Thunderstore as well.
on:
  push:
    branches: ["master"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing after checkout uses git; don't leave a write-scoped
          # credential on disk while third-party build code runs.
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Fetch reference assemblies
        run: ./scripts/fetch-libs.sh

      - name: Verify build environment
        run: |
          dotnet --version
          test -f Environment.props || { echo "::error::Environment.props missing - fetch-libs.sh did not complete."; exit 1; }
          for f in UnityEngine.dll UnityEngine.CoreModule.dll UnityEngine.UI.dll assembly_valheim.dll; do
            test -f "vendor/valheim/valheim_Data/Managed/$f" \
              || { echo "::error::vendor/valheim/valheim_Data/Managed/$f missing."; exit 1; }
          done
          test -f vendor/valheim/BepInEx/core/BepInEx.dll \
            || { echo "::error::BepInEx core assemblies missing."; exit 1; }

      - name: Build release package
        run: dotnet build VikingSettlements.sln -c Release

      - name: Resolve tag and verify version consistency
        id: tag
        run: |
          manifest_version=$(python3 -c "import json; print(json.load(open('VikingSettlements/Package/manifest.json'))['version_number'])")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "v$manifest_version" && "$tag" != "v$manifest_version-"* ]]; then
              echo "::error::Tag $tag does not match manifest version_number $manifest_version (expected v$manifest_version)."
              exit 1
            fi
          else
            tag="v$manifest_version"
          fi
          # The manifest is what Thunderstore shows; PluginVersion is what
          # Jotunn's multiplayer handshake compares. Keep all three in step.
          if ! grep -q "PluginVersion = \"$manifest_version\"" VikingSettlements/VikingSettlements.cs; then
            echo "::error::PluginVersion in VikingSettlements.cs does not match manifest version_number $manifest_version."
            exit 1
          fi
          if ! grep -q "^### $manifest_version\$" VikingSettlements/CHANGELOG.md; then
            echo "::error::No '### $manifest_version' changelog section in VikingSettlements/CHANGELOG.md."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for the release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 - "$TAG" <<'EOF'
          import re
          import sys

          version = sys.argv[1].lstrip("v").split("-")[0]
          text = open("VikingSettlements/CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"### {re.escape(version)}\n(.*?)(?=\n### |\Z)", text, re.S)
          notes = match.group(1).strip() if match else ""
          open("release-notes.md", "w", encoding="utf-8").write(notes)
          print(notes or "(no changelog section found - will fall back to generated notes)")
          EOF

      - name: Upload build artifact (non-release runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: VikingSettlements-${{ steps.tag.outputs.tag }}-${{ github.sha }}
          path: VikingSettlements/VikingSettlements.zip

      - name: Publish GitHub release with the package attached
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Two copies: the versioned name for humans downloading multiple
          # releases, and the stable basename that keeps the
          # releases/latest/download/VikingSettlements.zip URL working.
          cp VikingSettlements/VikingSettlements.zip "VikingSettlements-$TAG.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - updating it instead of failing."
            edit_args=(--title "VikingSettlements $TAG")
            # gh release edit has no --generate-notes; only override notes
            # when a changelog section was actually extracted.
            if [ -s release-notes.md ]; then
              edit_args+=(--notes-file release-notes.md)
            fi
            gh release edit "$TAG" "${edit_args[@]}"
            gh release upload "$TAG" \
              "VikingSettlements-$TAG.zip" \
              VikingSettlements/VikingSettlements.zip \
              --clobber
          else
            if [ -s release-notes.md ]; then
              notes_args=(--notes-file release-notes.md)
            else
              notes_args=(--generate-notes)
            fi
            # --target pins a dispatch-created tag to the commit that was
            # actually built; it is ignored when the tag already exists.
            gh release create "$TAG" \
              "VikingSettlements-$TAG.zip" \
              VikingSettlements/VikingSettlements.zip \
              --title "VikingSettlements $TAG" \
              --target "$GITHUB_SHA" \
              "${notes_args[@]}"
          fi

  # Pushes the same zip the GitHub release carries to Thunderstore as a new
  # version of morosmods-VikingSettlements. Requires the THUNDERSTORE_API_KEY
  # secret (a service-account token from the morosmods team); without it the
  # job skips gracefully so releases keep working for manual uploads.
  # Note: Thunderstore versions are immutable - re-running a release that
  # already published will fail here; bump the version instead.
  thunderstore:
    name: Publish to Thunderstore
    needs: release
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check for the publish token
        id: token
        env:
          TS_TOKEN: ${{ secrets.THUNDERSTORE_API_KEY }}
        run: |
          if [ -n "$TS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No THUNDERSTORE_API_KEY secret configured - skipping the Thunderstore publish."
          fi

      # Thunderstore versions are immutable, so a re-run of an already
      # published release must skip rather than fail.
      - name: Check whether this version is already on Thunderstore
        id: published
        if: ${{ steps.token.outputs.present == 'true' }}
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://thunderstore.io/api/experimental/package/morosmods/VikingSettlements/$version/")
          if [ "$code" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "morosmods-VikingSettlements-$version is already on Thunderstore - nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the release package
        if: ${{ steps.token.outputs.present == 'true' && steps.published.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "VikingSettlements-$TAG.zip"

      - name: Publish to Thunderstore
        id: publish
        # A concurrent run can publish this version between our pre-check
        # and this step; the follow-up step decides whether a failure here
        # was that benign race or a real problem.
        continue-on-error: true
        if: ${{ steps.token.outputs.present == 'true' && steps.published.outputs.exists != 'true' }}
        uses: GreenTF/upload-thunderstore-package@aef20d7e07a0858d0decae64872aa5526662ab8d # v4.3
        with:
          token: ${{ secrets.THUNDERSTORE_API_KEY }}
          community: valheim
          namespace: morosmods
          name: VikingSettlements
          version: ${{ needs.release.outputs.tag }}
          description: "NPC settlements: wild villages, recruitable settlers, your own settlement with jobs, raids and rival clans."
          website: https://github.com/abjumb/VikingSettlements
          file: VikingSettlements-${{ needs.release.outputs.tag }}.zip
          # The action's default repository selection is buggy when this is
          # unset; always pass it explicitly.
          repo: "https://thunderstore.io"

      - name: Treat an already-published version as success
        if: ${{ steps.publish.outcome == 'failure' }}
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://thunderstore.io/api/experimental/package/morosmods/VikingSettlements/$version/")
            if [ "$code" = "200" ]; then
              echo "morosmods-VikingSettlements-$version is on Thunderstore - the publish failure was a duplicate-version race, all good."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Thunderstore publish failed and version $version is not visible on Thunderstore."
          exit 1
